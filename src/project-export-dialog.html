<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Project export</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Tahoma, Arial, sans-serif; font-size: 13px; color: #252423; background: #fff; }
  #c { padding: 20px 24px; }
  h2 { margin: 0 0 4px 0; font-size: 18px; font-weight: 600; }
  .sub { margin: 0 0 18px 0; color: #605e5c; }
  .grp { margin-bottom: 16px; }
  .lbl { display: block; font-weight: 600; margin-bottom: 8px; }
  .opt { display: flex; align-items: center; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  .opt:hover { background: #f3f2f1; }
  .opt input { margin-right: 10px; width: 16px; height: 16px; accent-color: #0078d4; }
  .err { background: #fde7e9; border-left: 3px solid #a4262c; color: #a4262c; padding: 8px 12px; margin-bottom: 12px; display: none; }
  .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .btn { padding: 8px 18px; font-size: 13px; font-weight: 600; border-radius: 2px; cursor: pointer; border: 1px solid transparent; font-family: inherit; text-decoration: none; display: inline-block; }
  .pri { background: #0078d4; color: #fff; }
  .pri:hover { background: #106ebe; }
  .sec { background: #fff; color: #201f1e; border-color: #8a8886; }
  .sec:hover { background: #f3f2f1; }
  #s2 { text-align: center; padding-top: 16px; display: none; }
  .spin { width: 32px; height: 32px; margin: 0 auto 14px; border: 3px solid #f3f2f1; border-top-color: #0078d4; border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #st { font-size: 14px; margin-bottom: 8px; }
  #st.ok { color: #107c10; }
  #st.bad { color: #a4262c; }
  #links { justify-content: center; }
</style>
</head>
<body>
<div id="c">
  <h2>Project export</h2>
  <p class="sub" id="proj"></p>
  <div id="s1">
    <div class="grp">
      <span class="lbl">Select data to export</span>
      <label class="opt"><input type="checkbox" id="c-tasks"><span>Project Tasks</span></label>
      <label class="opt"><input type="checkbox" id="c-time"><span>Project Time Entries</span></label>
    </div>
    <div class="err" id="e1"></div>
    <div class="btns">
      <button class="btn sec" id="b-cancel">Cancel</button>
      <button class="btn pri" id="b-go">Export</button>
    </div>
  </div>
  <div id="s2">
    <div class="spin" id="sp"></div>
    <p id="st">Retrieving data...</p>
    <div class="btns" id="links"></div>
    <div class="btns"><button class="btn sec" id="b-close" style="display:none;">Close</button></div>
  </div>
</div>
<script>
// ============================================================
// SimpleXlsx — αυτόνομος writer για .xlsx (χωρίς SharePoint/Excel
// Numeric values are emitted as OOXML numeric cells.
// A fixed two-decimal format avoids locale-dependent rendering.
// "0.00" ώστε να εμφανίζονται πάντα με 2 δεκαδικά — ανεξάρτητα
//
// ============================================================
var SimpleXlsx = (function () {
  "use strict";
  var CRC_TABLE = (function () {
    var table = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) {
        c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      }
      table[n] = c >>> 0;
    }
    return table;
  })();
  function crc32(bytes) {
    var crc = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) {
      crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  function strToBytes(str) { return new TextEncoder().encode(str); }
  function colLetter(idx) {
    var s = "";
    idx = idx + 1;
    while (idx > 0) {
      var rem = (idx - 1) % 26;
      s = String.fromCharCode(65 + rem) + s;
      idx = Math.floor((idx - 1) / 26);
    }
    return s;
  }
  function xmlEscape(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&apos;");
  }
  function sanitizeSheetName(name) {
    var s = String(name || "Sheet").replace(/[:\\\\\\/\\?\\*\\[\\]]/g, "-");
    return s.length > 31 ? s.substring(0, 31) : s;
  }
  function buildZip(files) {
    var localParts = [];
    var centralParts = [];
    var offset = 0;
    files.forEach(function (f) {
      var nameBytes = strToBytes(f.name);
      var data = f.data;
      var crc = crc32(data);
      var size = data.length;
      var localHeader = new Uint8Array(30 + nameBytes.length);
      var dv = new DataView(localHeader.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 0, true);
      dv.setUint16(8, 0, true);
      dv.setUint16(10, 0, true);
      dv.setUint16(12, 0x21, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, size, true);
      dv.setUint32(22, size, true);
      dv.setUint16(26, nameBytes.length, true);
      dv.setUint16(28, 0, true);
      localHeader.set(nameBytes, 30);
      localParts.push(localHeader, data);
      var centralHeader = new Uint8Array(46 + nameBytes.length);
      var cdv = new DataView(centralHeader.buffer);
      cdv.setUint32(0, 0x02014b50, true);
      cdv.setUint16(4, 20, true);
      cdv.setUint16(6, 20, true);
      cdv.setUint16(8, 0, true);
      cdv.setUint16(10, 0, true);
      cdv.setUint16(12, 0, true);
      cdv.setUint16(14, 0x21, true);
      cdv.setUint32(16, crc, true);
      cdv.setUint32(20, size, true);
      cdv.setUint32(24, size, true);
      cdv.setUint16(28, nameBytes.length, true);
      cdv.setUint16(30, 0, true);
      cdv.setUint16(32, 0, true);
      cdv.setUint16(34, 0, true);
      cdv.setUint16(36, 0, true);
      cdv.setUint32(38, 0, true);
      cdv.setUint32(42, offset, true);
      centralHeader.set(nameBytes, 46);
      centralParts.push(centralHeader);
      offset += localHeader.length + data.length;
    });
    var centralSize = centralParts.reduce(function (a, p) { return a + p.length; }, 0);
    var centralOffset = offset;
    var eocd = new Uint8Array(22);
    var edv = new DataView(eocd.buffer);
    edv.setUint32(0, 0x06054b50, true);
    edv.setUint16(4, 0, true);
    edv.setUint16(6, 0, true);
    edv.setUint16(8, files.length, true);
    edv.setUint16(10, files.length, true);
    edv.setUint32(12, centralSize, true);
    edv.setUint32(16, centralOffset, true);
    edv.setUint16(20, 0, true);
    var allParts = localParts.concat(centralParts, [eocd]);
    var totalLen = allParts.reduce(function (a, p) { return a + p.length; }, 0);
    var out = new Uint8Array(totalLen);
    var pos = 0;
    allParts.forEach(function (p) { out.set(p, pos); pos += p.length; });
    return out;
  }
  function contentTypesXml(sheetCount) {
    var overrides = "";
    for (var i = 1; i <= sheetCount; i++) {
      overrides += '<Override PartName="/xl/worksheets/sheet' + i + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    }
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      overrides + '</Types>';
  }
  function rootRelsXml() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>';
  }
  function workbookXml(sheetDefs) {
    var sheetsXml = sheetDefs.map(function (s, i) {
      return '<sheet name="' + xmlEscape(s.safeName) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
    }).join("");
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets>' + sheetsXml + '</sheets></workbook>';
  }
  function workbookRelsXml(sheetDefs) {
    var rels = sheetDefs.map(function (s, i) {
      return '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>';
    }).join("");
    var stylesRid = "rId" + (sheetDefs.length + 1);
    rels += '<Relationship Id="' + stylesRid + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + rels + '</Relationships>';
  }
  // Style indices:
  //   0 = General (απλό κείμενο)
  //   1 = αριθμός με σταθερά 2 δεκαδικά (format "0.00")
  //   2 = bold (header)
  var STYLE_NUMBER_2DP = 1;
  function stylesXml() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<numFmts count="1"><numFmt numFmtId="164" formatCode="0.00"/></numFmts>' +
      '<fonts count="2">' +
        '<font><sz val="11"/><name val="Calibri"/></font>' +
        '<font><b/><sz val="11"/><name val="Calibri"/></font>' +
      '</fonts>' +
      '<fills count="2">' +
        '<fill><patternFill patternType="none"/></fill>' +
        '<fill><patternFill patternType="gray125"/></fill>' +
      '</fills>' +
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="3">' +
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
        '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
        '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
      '</cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>';
  }
  function cellXml(colIdx, rowIdx, value, type) {
    var ref = colLetter(colIdx) + rowIdx;
    if (type === "number") {
      if (value === "" || value == null || isNaN(value)) {
        return '<c r="' + ref + '" s="' + STYLE_NUMBER_2DP + '"/>';
      }
      return '<c r="' + ref + '" s="' + STYLE_NUMBER_2DP + '"><v>' + Number(value) + '</v></c>';
    }
    if (type === "header") {
      var htext = value == null ? "" : String(value);
      return '<c r="' + ref + '" s="2" t="inlineStr"><is><t xml:space="preserve">' + xmlEscape(htext) + '</t></is></c>';
    }
    var text = value == null ? "" : String(value);
    return '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEscape(text) + '</t></is></c>';
  }
  function sheetXml(sheetDef) {
    var cols = sheetDef.columns;
    var rowsXml = "";
    var headerCells = cols.map(function (c, ci) { return cellXml(ci, 1, c.header, "header"); }).join("");
    rowsXml += '<row r="1">' + headerCells + '</row>';
    sheetDef.rows.forEach(function (row, ri) {
      var rNum = ri + 2;
      var cells = cols.map(function (c, ci) {
        return cellXml(ci, rNum, row[ci], c.type === "number" ? "number" : "text");
      }).join("");
      rowsXml += '<row r="' + rNum + '">' + cells + '</row>';
    });
    var dimRef = "A1:" + colLetter(cols.length - 1) + (sheetDef.rows.length + 1);
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<dimension ref="' + dimRef + '"/><sheetData>' + rowsXml + '</sheetData></worksheet>';
  }
  function build(sheetDefsRaw) {
    var sheetDefs = sheetDefsRaw.map(function (s) {
      return { safeName: sanitizeSheetName(s.name), columns: s.columns, rows: s.rows };
    });
    var files = [];
    files.push({ name: "[Content_Types].xml", data: strToBytes(contentTypesXml(sheetDefs.length)) });
    files.push({ name: "_rels/.rels", data: strToBytes(rootRelsXml()) });
    files.push({ name: "xl/workbook.xml", data: strToBytes(workbookXml(sheetDefs)) });
    files.push({ name: "xl/_rels/workbook.xml.rels", data: strToBytes(workbookRelsXml(sheetDefs)) });
    files.push({ name: "xl/styles.xml", data: strToBytes(stylesXml()) });
    sheetDefs.forEach(function (s, i) {
      files.push({ name: "xl/worksheets/sheet" + (i + 1) + ".xml", data: strToBytes(sheetXml(s)) });
    });
    var zipBytes = buildZip(files);
    return new Blob([zipBytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  }
  return { build: build };
})();
// ============================================================
// Λογική του dialog
// ============================================================
(function () {
  "use strict";
  var PROJECT_ENTITY_TASK = "msdyn_projecttask";
  var PROJECT_ENTITY_TIME = "msdyn_timeentry";
  var PROJECT_LOOKUP = "_msdyn_project_value";
  var state = { projectId: null, projectName: "", blobUrl: null };
  function $(id) { return document.getElementById(id); }
  function getXrm() {
    try { if (window.parent && window.parent.Xrm) { return window.parent.Xrm; } } catch (e) {}
    try { if (window.top && window.top.Xrm) { return window.top.Xrm; } } catch (e) {}
    return null;
  }
  function getInput() {
    try {
      var p = new URLSearchParams(window.location.search).get("data");
      if (p) { return JSON.parse(p); }
    } catch (e) {}
    try {
      var s = window.localStorage.getItem("d365_project_export_context");
      if (s) { return JSON.parse(s); }
    } catch (e) {}
    return null;
  }
  function fv(r, f) { return r[f + "@OData.Community.Display.V1.FormattedValue"]; }
  function val(r, f) { var v = r[f]; return v == null ? "" : v; }
  function fvOr(r, f) { var x = fv(r, f); return x != null && x !== "" ? x : val(r, f); }
  function lk(r, f) { var x = fv(r, "_" + f + "_value"); return x == null ? "" : x; }
  function numOrEmpty(n) { return (n === "" || n == null || isNaN(n)) ? "" : Math.round(n * 100) / 100; }
  // Columns with type "number" are emitted as numeric cells with a 0.00 format.
  var COLS_TASKS = [
    { header: "WBS ID", type: "text", v: function (r) { return val(r, "msdyn_wbsid"); } },
    { header: "Task", type: "text", v: function (r) { return val(r, "msdyn_subject"); } },
    { header: "Parent Task", type: "text", v: function (r) { return lk(r, "msdyn_parenttask"); } },
    { header: "Bucket", type: "text", v: function (r) { return lk(r, "msdyn_projectbucket"); } },
    { header: "Start", type: "text", v: function (r) { return fvOr(r, "msdyn_start"); } },
    { header: "Finish", type: "text", v: function (r) { return fvOr(r, "msdyn_finish"); } },
    { header: "Effort (h)", type: "number", v: function (r) { return numOrEmpty(r.msdyn_effort); } },
    { header: "Effort Completed (h)", type: "number", v: function (r) { return numOrEmpty(r.msdyn_effortcompleted); } },
    { header: "Effort Remaining (h)", type: "number", v: function (r) { return numOrEmpty(r.msdyn_effortremaining); } },
    { header: "Progress (%)", type: "number", v: function (r) { return r.msdyn_progress == null ? "" : numOrEmpty(r.msdyn_progress * 100); } },
    { header: "Description", type: "text", v: function (r) { return val(r, "msdyn_description"); } }
  ];
  var COLS_TIME = [
    { header: "Date", type: "text", v: function (r) { return fvOr(r, "msdyn_date"); } },
    { header: "Resource", type: "text", v: function (r) { return lk(r, "msdyn_bookableresource"); } },
    { header: "Task", type: "text", v: function (r) { return lk(r, "msdyn_projecttask"); } },
    { header: "Type", type: "text", v: function (r) { return fvOr(r, "msdyn_type"); } },
    { header: "Status", type: "text", v: function (r) { return fvOr(r, "msdyn_entrystatus"); } },
    { header: "Duration (h)", type: "number", v: function (r) { return r.msdyn_duration == null ? "" : numOrEmpty(r.msdyn_duration / 60); } },
    { header: "Description", type: "text", v: function (r) { return val(r, "msdyn_description"); } }
  ];
  function wbsKey(s) {
    return String(s || "").split(".").map(function (p) { return parseInt(p, 10) || 0; });
  }
  function cmpWbs(a, b) {
    var x = wbsKey(a.msdyn_wbsid), y = wbsKey(b.msdyn_wbsid);
    var n = Math.max(x.length, y.length);
    for (var i = 0; i < n; i++) {
      var d = (x[i] || 0) - (y[i] || 0);
      if (d) { return d; }
    }
    return 0;
  }
  function cmpTime(a, b) {
    var da = String(a.msdyn_date || ""), db = String(b.msdyn_date || "");
    if (da !== db) { return da < db ? -1 : 1; }
    var ra = lk(a, "msdyn_bookableresource"), rb = lk(b, "msdyn_bookableresource");
    return ra < rb ? -1 : ra > rb ? 1 : 0;
  }
  async function fetchAll(entity, query) {
    var xrm = getXrm();
    var rows = [];
    var res = await xrm.WebApi.retrieveMultipleRecords(entity, "?" + query, 5000);
    rows = rows.concat(res.entities);
    while (res.nextLink) {
      var q = res.nextLink.substring(res.nextLink.indexOf("?"));
      res = await xrm.WebApi.retrieveMultipleRecords(entity, q, 5000);
      rows = rows.concat(res.entities);
    }
    return rows;
  }
  function toSheetRows(rows, cols) {
    return rows.map(function (r) { return cols.map(function (c) { return c.v(r); }); });
  }
  function safeName(s) { return String(s || "project").replace(/[\\\\\\/:*?"<>|&]/g, "-").trim(); }
  // Ημερομηνία/ώρα εξαγωγής, για να φαίνεται στο όνομα αρχείου πότε
  // πάρθηκαν τα δεδομένα από το σύστημα (τοπική ώρα browser).
  function exportTimestamp() {
    var d = new Date();
    var pad = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
      "_" + pad(d.getHours()) + pad(d.getMinutes());
  }
  function setStatus(t, cls) {
    var el = $("st");
    el.textContent = t;
    el.className = cls || "";
    $("sp").style.display = cls ? "none" : "block";
  }
  function revokeBlobUrl() {
    if (state.blobUrl) { URL.revokeObjectURL(state.blobUrl); state.blobUrl = null; }
  }
  async function run() {
    var doTasks = $("c-tasks").checked;
    var doTime = $("c-time").checked;
    $("e1").style.display = "none";
    if (!doTasks && !doTime) {
      $("e1").textContent = "Select at least one data set.";
      $("e1").style.display = "block";
      return;
    }
    if (!getXrm() || !getXrm().WebApi) {
      $("e1").textContent = "Dynamics 365 Xrm context was not found.";
      $("e1").style.display = "block";
      return;
    }
    if (!state.projectId) {
      $("e1").textContent = "Project context was not found.";
      $("e1").style.display = "block";
      return;
    }
    $("s1").style.display = "none";
    $("s2").style.display = "block";
    $("links").innerHTML = "";
    var filter = "$filter=" + PROJECT_LOOKUP + " eq " + state.projectId;
    var base = safeName(state.projectName) + "_" + exportTimestamp();
    var sheets = [];
    var summary = [];
    try {
      if (doTasks) {
        setStatus("Retrieving project tasks...");
        var tasks = await fetchAll(PROJECT_ENTITY_TASK, filter);
        tasks.sort(cmpWbs);
        summary.push("Tasks: " + tasks.length);
        sheets.push({
          name: "Project Tasks",
          columns: COLS_TASKS.map(function (c) { return { header: c.header, type: c.type }; }),
          rows: toSheetRows(tasks, COLS_TASKS)
        });
      }
      if (doTime) {
        setStatus("Retrieving project time entries...");
        var times = await fetchAll(PROJECT_ENTITY_TIME, filter);
        times.sort(cmpTime);
        summary.push("Time Entries: " + times.length);
        sheets.push({
          name: "Project Time Entries",
          columns: COLS_TIME.map(function (c) { return { header: c.header, type: c.type }; }),
          rows: toSheetRows(times, COLS_TIME)
        });
      }
      revokeBlobUrl();
      var blob = SimpleXlsx.build(sheets);
      state.blobUrl = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = state.blobUrl;
      a.download = base + ".xlsx";
      a.className = "btn pri";
      a.textContent = "Λήψη Excel (" + summary.join(" · ") + ")";
      $("links").insertBefore(a, null);
      setStatus("Completed — " + summary.join(" · "), "ok");
    } catch (e) {
      setStatus("Error: " + (e && e.message ? e.message : e), "bad");
    }
    $("b-close").style.display = "inline-block";
  }
  function closeDlg() {
    revokeBlobUrl();
    window.close();
  }
  function init() {
    var data = getInput();
    if (data) {
      state.projectId = String(data.projectId || "").replace(/[{}]/g, "");
      state.projectName = data.projectName || "";
    }
    $("proj").textContent = state.projectName ? "Project: " + state.projectName : "";
    $("b-go").addEventListener("click", run);
    $("b-cancel").addEventListener("click", closeDlg);
    $("b-close").addEventListener("click", closeDlg);
  }
  document.addEventListener("DOMContentLoaded", init);
})();
